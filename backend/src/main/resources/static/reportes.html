<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reportes - Ferreteria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="mb-4">Panel de Reportes</h1>

        <div class="row text-center mb-4">
            <div class="col-md-4">
                <div class="card p-3 shadow-sm">
                    <h5>Total Clientes</h5>
                    <h3 id="txtClientes" class="text-primary">-</h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3 shadow-sm">
                    <h5>Total Productos</h5>
                    <h3 id="txtProductos" class="text-success">-</h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3 shadow-sm">
                    <h5>Valor de Inventario</h5>
                    <h3 id="txtInventario" class="text-danger">-</h3>
                </div>
            </div>
        </div>

        <div class="card p-4 shadow-sm">
            <h3>Productos por Categoria</h3>
            <ul id="listaCategorias" class="list-group mt-3"></ul>
        </div>
    </div>

    <script src="reportes.js"></script>
</body>
</html>
